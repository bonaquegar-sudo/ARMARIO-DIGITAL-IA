[package]
name = "armario-digital"
version = "0.1.0"
edition = "2021"

[lib]
name = "armario_digital_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
